version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/docker/janus"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/docker/proxy"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/docker/server"
    schedule:
      interval: "daily"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
    groups:
      etcd:
        patterns:
        - "go.etcd.io*"
      opentelemetry:
        patterns:
        - "go.opentelemetry.io*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      artifacts:
        patterns:
        - "actions/*-artifact"

  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "daily"
